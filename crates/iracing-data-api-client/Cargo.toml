[package]
name = "iracing-data-api-client"
version = "0.1.0"
authors = [ "iRacing Data API contributors" ]
description = "Typed Rust client for the iRacing Data API, generated from maintained OpenAPI schemas."
license = "MIT"
edition = "2021"
repository = "https://github.com/racedirector/iracing-data-api"
homepage = "https://github.com/racedirector/iracing-data-api"
documentation = "https://docs.rs/iracing-data-api-client"
keywords = [ "iracing", "sim-racing", "api-client", "openapi" ]
categories = [ "api-bindings" ]

[package.metadata.dist]
dist = true

[dependencies]
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"

[dependencies.serde]
version = "^1.0"
features = [ "derive" ]

[dependencies.reqwest]
version = "^0.12"
default-features = false
features = [ "json" ]

[dev-dependencies.clap]
version = "^4.5"
features = [ "derive" ]

[dev-dependencies.tokio]
version = "^1.37"
features = [ "macros", "rt-multi-thread" ]

[features]
default = []
native-tls = [ "reqwest/native-tls" ]
rustls-tls = [ "reqwest/rustls-tls" ]

[lints]
workspace = true

[[test]]
name = "data-docs-contract"
path = "../../tests/rust-contract/data-docs.rs"
