services:
  mcp:
    image: iracing-data-mcp:${IRACING_MCP_IMAGE_TAG:?Set the local git SHA image tag}
    build:
      context: ../..
      dockerfile: apps/iracing-data-mcp/Dockerfile
    user: "${IRACING_MCP_UID:?Set your nonzero host UID}:${IRACING_MCP_GID:?Set your nonzero host GID}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - type: bind
        source: ${IRACING_MCP_DATA_DIR:?Set an absolute owned 0700 credential directory}
        target: /var/lib/iracing-data-mcp
        bind:
          create_host_path: false
    environment:
      IRACING_MCP_CLIENT_SECRET_FILE: ${IRACING_MCP_CLIENT_SECRET_FILE:-}
      IRACING_MCP_CLIENT_ID: ${IRACING_MCP_CLIENT_ID:?Set the same client ID used by host login}
      IRACING_MCP_ALLOWED_HOSTS: ${IRACING_MCP_ALLOWED_HOSTS:-127.0.0.1:3000,localhost:3000}
      IRACING_MCP_ALLOWED_ORIGINS: ${IRACING_MCP_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      IRACING_MCP_LISTEN_HOST: 0.0.0.0
    stop_grace_period: 15s
