services:
  mcp:
    image: iracing-data-mcp:${IRACING_MCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/iracing-data-mcp/Dockerfile
    user: "${IRACING_MCP_UID:?Set IRACING_MCP_UID in the root .env}:${IRACING_MCP_GID:?Set IRACING_MCP_GID in the root .env}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - type: bind
        source: ../../.iracing-data/iracing-data-mcp
        target: /var/lib/iracing-data-mcp
        bind:
          create_host_path: false
    environment:
      IRACING_MCP_CLIENT_SECRET_FILE: ${IRACING_MCP_CLIENT_SECRET_FILE:-}
      IRACING_MCP_CLIENT_ID: ${IRACING_AUTH_CLIENT:?Set IRACING_AUTH_CLIENT in the root .env}
      IRACING_MCP_ALLOWED_HOSTS: ${IRACING_MCP_ALLOWED_HOSTS:-127.0.0.1:3000,localhost:3000}
      IRACING_MCP_ALLOWED_ORIGINS: ${IRACING_MCP_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
    stop_grace_period: 15s
