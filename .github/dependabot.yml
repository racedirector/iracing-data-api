version: 2
updates:
  # One pnpm lockfile/workspace: do not add overlapping package directories.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      lint-and-format:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier*"
        update-types: ["minor", "patch"]
      runtime-patches:
        dependency-type: "production"
        patterns: ["*"]
        exclude-patterns:
          - "oauth4webapi"
          - "better-call"
          - "zod*"
          - "@asteasolutions/zod-to-openapi"
          - "axios"
          - "@openapitools/*"
        update-types: ["patch"]
    # Unmatched updates, including majors and sensitive protocol/toolchain
    # packages, remain individual PRs. No versions or security fixes are ignored.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
