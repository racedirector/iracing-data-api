# Dependency-update review policy lives here; groups never imply auto-merge.
# The root lockfile is shared by nested manifests, so overlapping scans duplicate
# proposals. Sensitive protocol/toolchain patches and majors stay individually
# reviewable; grouping version updates does not ignore security fixes.
# Service support for the pinned pnpm version must be established from update
# logs: local frozen installation cannot prove hosted updater compatibility.
version: 2
updates:
  # One pnpm lockfile/workspace: do not add overlapping package directories.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      lint-and-format:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier*"
        update-types: ["minor", "patch"]
      runtime-patches:
        dependency-type: "production"
        patterns: ["*"]
        exclude-patterns:
          - "oauth4webapi"
          - "better-call"
          - "zod*"
          - "@asteasolutions/zod-to-openapi"
          - "axios"
          - "@openapitools/*"
        update-types: ["patch"]
    # Unmatched updates, including majors and sensitive protocol/toolchain
    # packages, remain individual PRs. No versions or security fixes are ignored.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
