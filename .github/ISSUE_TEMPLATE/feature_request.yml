name: Feature request
description: Propose a new externally consumable capability or materially new public behavior.
title: "Feature: "
type: feature
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form for new user/developer-facing capability. For maintenance, refactoring, documentation, release, packaging, migration, or repository work, use the **Task / improvement** form instead.

        GitHub Issue Type is the canonical classification axis. See the [issue triage guide](https://github.com/racedirector/iracing-data-api/blob/main/docs/ISSUE-TRIAGE.md) for area, priority, and status conventions.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What new capability should exist, and who benefits from it?
      placeholder: Add a first-class MCP tool that lets agents retrieve bounded iRacing subsession results by subsession ID.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: This helps maintainers assign the appropriate area:* label during triage.
      options:
        - OAuth
        - Data API schemas or client behavior
        - Generated clients
        - Better Call router
        - MCP application
        - Rust client
        - Examples or public developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user/developer workflow is currently impossible, awkward, or missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the externally observable capability or contract. Keep implementation details secondary unless they constrain the public behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What would make the feature complete and usable?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note expected API/schema compatibility, migration concerns, or intentionally deferred behavior.
  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      description: Mention useful contract, build, integration, example, or compatibility checks.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues, PRs, upstream iRacing documentation, examples, or follow-up work to keep out of scope.
