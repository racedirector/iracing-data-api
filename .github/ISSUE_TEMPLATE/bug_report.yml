name: Bug report
description: Report existing behavior that is broken, unsafe, regressed, or violates its intended contract.
title: "Bug: "
type: Bug
labels: ["priority:P2"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when existing repository behavior does not satisfy its intended contract.

        GitHub Issue Type is the canonical classification axis. See the [issue triage guide](https://github.com/racedirector/iracing-data-api/blob/main/docs/ISSUE-TRIAGE.md) for area, priority, and status conventions.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect instead?
      placeholder: The OAuth client attempts two refresh-token grants when concurrent callers restore the same expired session.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: This helps maintainers assign the appropriate area:* label during triage.
      options:
        - OAuth client or schemas
        - Data API schemas or OpenAPI
        - Fetch generated client
        - Axios generated client
        - Rust generated client
        - MCP application
        - Example or documentation
        - Release, packaging, or npm metadata
        - Repository tooling, CI, or automation
        - Other
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package or path
      description: Name the package, application, example, or path if you know it.
      placeholder: packages/oauth/client
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands, code snippets, request shape, relevant environment variables, or example inputs. Redact secrets and tokens.
      placeholder: |
        1. pnpm --filter @iracing-data/oauth-client build
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Paste the error, status code, response body, stack trace, or generated output difference.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include versions that matter for the report.
      value: |
        - Node:
        - pnpm:
        - Package version or commit:
        - Runtime:
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links, screenshots, related issues, or notes about a likely fix.
