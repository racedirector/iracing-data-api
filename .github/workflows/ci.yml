name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Setup Java for OpenAPI Generator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report dependency change impact
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          IMPACT_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/workspace-impact.mjs --base "$IMPACT_BASE" --json > "$RUNNER_TEMP/dependency-impact.json"

      - name: Upload dependency impact
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: dependency-impact
          path: ${{ runner.temp }}/dependency-impact.json
          retention-days: 14

      - name: Verify repository
        run: pnpm verify
