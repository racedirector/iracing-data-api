# The same service-free verification runner is the required local/main contract.
# Full history lets dependency impact use the PR's exact base SHA against the
# checked-out merge revision. Its artifact informs review, never release selection.
# Read-only permissions and frozen installation keep verification non-publishing.
# Docker recovery is separate because it requires a daemon and POSIX host identity;
# the production-image harness owns its synthetic persistence/failure evidence.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: issue-448-jsdoc-lint

      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: issue-448-source
          path: .
          retention-days: 1
          include-hidden-files: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Setup Java for OpenAPI Generator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply and commit issue 448 rollout
        run: |
          base64 --decode scripts/issue448-docs.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/issue448-docs.patch"
          if git apply --check "$RUNNER_TEMP/issue448-docs.patch" 2>/dev/null; then
            git apply "$RUNNER_TEMP/issue448-docs.patch"
          fi
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "apps/iracing-data-mcp/src/diagnostics/errors.ts": (
                  "  readonly request_id: string;\n}\n/**\n * Creates",
                  "  readonly request_id: string;\n}\n\n/**\n * Creates",
              ),
              "apps/iracing-data-mcp/src/gateway/gateway.ts": (
                  "  }\n}\n/**\n * Per-call gateway facade",
                  "  }\n}\n\n/**\n * Per-call gateway facade",
              ),
              "apps/iracing-data-mcp/src/gateway/transport.ts": (
                  ") => Promise<Response>;\n/**\n * DNS-resolution seam",
                  ") => Promise<Response>;\n\n/**\n * DNS-resolution seam",
              ),
              "apps/iracing-data-mcp/src/session.ts": (
                  'export const MCP_CREDENTIAL_FILE = "/var/lib/iracing-data-mcp/credentials.json";\n/**\n * MCP session',
                  'export const MCP_CREDENTIAL_FILE = "/var/lib/iracing-data-mcp/credentials.json";\n\n/**\n * MCP session',
              ),
              "apps/iracing-data-mcp/src/tools/collections.ts": (
                  "  ttlMs: 300_000,\n});\n/**\n * Raises",
                  "  ttlMs: 300_000,\n});\n\n/**\n * Raises",
              ),
          }

          for relative_path, (before, after) in replacements.items():
              path = Path(relative_path)
              source = path.read_text()
              if before in source:
                  path.write_text(source.replace(before, after, 1))
          PY
          changed_ts="$(git diff --name-only -- '*.ts')"
          if [ -n "$changed_ts" ]; then
            pnpm exec prettier --write $changed_ts
          fi
          pnpm exec prettier --write eslint.config.mjs scripts/eslint-jsdoc-policy.test.mjs package.json
          git add apps packages eslint.config.mjs package.json pnpm-lock.yaml scripts/eslint-jsdoc-policy.test.mjs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: align MCP JSDoc spacing"
            git push origin HEAD:issue-448-jsdoc-lint
          fi

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: issue-448-lockfile
          path: pnpm-lock.yaml
          retention-days: 1

      - name: Capture JSDoc lint inventory
        run: pnpm exec eslint apps packages --format json > "$RUNNER_TEMP/jsdoc-inventory.json" || true

      - name: Upload JSDoc lint inventory
        uses: actions/upload-artifact@v7
        with:
          name: issue-448-jsdoc-inventory
          path: ${{ runner.temp }}/jsdoc-inventory.json
          retention-days: 1

      - name: Report dependency change impact
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          IMPACT_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/workspace-impact.mjs --base "$IMPACT_BASE" --json > "$RUNNER_TEMP/dependency-impact.json"

      - name: Upload dependency impact
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: dependency-impact
          path: ${{ runner.temp }}/dependency-impact.json
          retention-days: 14

      - name: Verify repository
        run: pnpm verify

  docker-offline:
    name: Docker offline recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Configure Docker Hub cache
        run: |
          sudo mkdir -p /etc/docker
          if [ ! -f /etc/docker/daemon.json ]; then
            printf '{}\n' | sudo tee /etc/docker/daemon.json > /dev/null
          fi
          sudo jq '."registry-mirrors" = (["https://mirror.gcr.io"] + ((."registry-mirrors" // []) - ["https://mirror.gcr.io"]))' /etc/docker/daemon.json > "$RUNNER_TEMP/docker-daemon.json"
          sudo cp "$RUNNER_TEMP/docker-daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'
      - name: Verify Docker prerequisites
        run: docker version
      - name: Verify offline Docker persistence and recovery
        run: pnpm verify:docker
