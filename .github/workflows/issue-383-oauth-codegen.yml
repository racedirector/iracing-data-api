name: Issue 383 OAuth codegen

on:
  push:
    branches:
      - codex/issue-383-oauth-generated-client

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[oauth-codegen]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Setup Java for OpenAPI Generator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OAuth Fetch client
        run: pnpm codegen:client:oauth:fetch

      - name: Commit generated package
        run: |
          if [ -z "$(git status --porcelain -- packages/oauth/client/generated)" ]; then
            echo "Generated package is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/oauth/client/generated
          git commit -m "build(oauth): generate Fetch client [oauth-codegen]"
          git push origin HEAD:codex/issue-383-oauth-generated-client
