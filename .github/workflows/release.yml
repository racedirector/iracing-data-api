# Per-package publication: manifests own independent versions and dist config owns
# managed membership. Tag releases validate selected topology and exact manifest
# version before dependency-closure build and publication; CI on main owns broader
# verification. This workflow does not generate SDKs or choose/bump versions.
# Manual dispatch is a recovery path: explicit package/dist-tag, no tag-version
# guard and no GitHub Release. Registry/environment trusted-publisher settings
# remain external prerequisites, not facts established by this YAML.
name: Release

on:
  push:
    tags:
      - "@iracing-data/*@*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (e.g. @iracing-data/oauth-client)"
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag (latest or next)"
        required: true
        type: choice
        default: next
        options:
          - latest
          - next

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Share strict SemVer classification with GitHub release presentation.
      # Manual dispatch remains an explicit package/dist-tag recovery path.
      - name: Resolve package and dist-tag
        id: pkg
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { publicationTarget } from "./scripts/release-notes.mjs";
          const target = publicationTarget({
            tag: process.env.EVENT_NAME === "workflow_dispatch" ? undefined : process.env.RELEASE_TAG,
            packageName: process.env.RELEASE_PACKAGE,
            distTag: process.env.DIST_TAG,
          });
          for (const [key, value] of Object.entries(target)) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PACKAGE: ${{ inputs.package }}
          DIST_TAG: ${{ inputs.dist_tag }}

      - name: Validate topology and publication ownership
        run: pnpm check:topology --release "${{ steps.pkg.outputs.name }}"

      # Guard against tagging the wrong commit â€” the tag version must match
      # the version declared in the package's package.json.
      - name: Verify tag version matches package.json
        if: github.event_name != 'workflow_dispatch'
        run: |
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG##*@}"
          PKG_VERSION=$(pnpm --filter "${{ steps.pkg.outputs.name }}" --fail-if-no-match exec node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            echo "::error::Update the package version before tagging."
            exit 1
          fi

      # Build this package and any workspace dependencies it has (suffix '...').
      - name: Build
        run: pnpm --filter "${{ steps.pkg.outputs.name }}..." --fail-if-no-match build

      - name: Debug npm auth inputs (redacted)
        shell: bash
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "env vars:"
          env | grep -E '^(NODE_AUTH_TOKEN|NPM_TOKEN|NPM_CONFIG_USERCONFIG|NPM_CONFIG_REGISTRY)=' || true

          echo ".npmrc files:"
          ls -la .npmrc || true
          ls -la ~/.npmrc || true

          echo "authToken from npm config (should be empty):"
          npm config get //registry.npmjs.org/:_authToken || true

          echo "npm config userconfig path:"
          npm config get userconfig || true

      # Empty token variables select trusted publishing/OIDC rather than a local
      # npm session. id-token permission alone is not proof of registry provenance.
      - name: Publish ${{ steps.pkg.outputs.name }}
        run: |
          pnpm --filter "${{ steps.pkg.outputs.name }}" --fail-if-no-match publish \
              --no-git-checks \
              --access public \
              --tag "${{ steps.pkg.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Publication succeeds first; full history selects a same-package ancestor
      # tag. The canonical impact graph filters package/dependency/codegen changes.
      - name: Generate package release notes
        id: notes
        run: node scripts/release-notes.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md" "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Create GitHub Release
        shell: bash
        run: |
          args=("$RELEASE_TAG" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "$RELEASE_TAG")
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
