name: Issue 438 formatting

on:
  push:
    branches:
      - issue-438-retire-upstream-contract

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-438-retire-upstream-contract
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format issue 438 authored files
        shell: bash
        run: |
          pnpm exec prettier --write \
            .agents/skills/iracing-data-api-compatibility-audit/SKILL.md \
            .agents/skills/iracing-data-api-compatibility-audit/audit-guidance.test.mjs \
            .agents/skills/iracing-data-api-compatibility-audit/references/live-workflow.md \
            .agents/skills/iracing-data-api-compatibility-audit/references/report-contract.md \
            apps/iracing-data-cli/README.md \
            docs/UPSTREAM-CONTRACT.md \
            docs/VERIFICATION.md \
            package.json \
            scripts/audit-data-docs.cjs \
            scripts/audit-data-docs.test.cjs \
            scripts/check-service-client-boundary.mjs \
            scripts/check-service-client-boundary.test.mjs \
            scripts/verify.mjs
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .agents/skills/iracing-data-api-compatibility-audit \
            apps/iracing-data-cli/README.md \
            docs/UPSTREAM-CONTRACT.md \
            docs/VERIFICATION.md \
            package.json \
            scripts/audit-data-docs.cjs \
            scripts/audit-data-docs.test.cjs \
            scripts/check-service-client-boundary.mjs \
            scripts/check-service-client-boundary.test.mjs \
            scripts/verify.mjs
          git commit -m 'Format upstream contract cleanup'
          git push origin HEAD:issue-438-retire-upstream-contract
