name: Issue 383 maintenance

on:
  push:
    branches:
      - codex/issue-383-oauth-generated-client

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[issue-383-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: >-
          pnpm exec prettier --write
          apps/iracing-data-cli/test/whoami.test.cjs
          packages/oauth/schema/src/schema.ts
          packages/oauth/client/src/generated/oauth-api.ts
          scripts/generate-oauth-client.mjs
      - name: Commit regenerated artifacts
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated or formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi packages/oauth/client/src/generated apps/iracing-data-cli/test/whoami.test.cjs packages/oauth/schema/src/schema.ts scripts/generate-oauth-client.mjs
          git commit -m "build(oauth): refresh generated artifacts [issue-383-generated]"
          git push origin HEAD:codex/issue-383-oauth-generated-client
