packages:
  - "apps/*"
  - "examples/*"
  - "packages/api/*"
  - "packages/api/client/*"
  - "packages/helpers/*"
  - "packages/mcp"
  - "packages/oauth/*"
  - "packages/oauth/client/*"
allowBuilds:
  '@modelcontextprotocol/inspector': set this to true or false
  "@nestjs/core": false
  "@openapitools/openapi-generator-cli": false
  esbuild: true
  unrs-resolver: false
